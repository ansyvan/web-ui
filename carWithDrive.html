<!doctype html>
<html lang="en">
    <head>
        <title>Car with Drive</title>
        <meta charset="utf-8">
        <script>

            var fiat = {
                make: "Fiat",
                model: "500",
                year: 1957,
                color: "Medium Blue",
                passengers: 2,
                convertible: false,
                mileage: 88000,
                started: false,
                fuel: 0,

                start: function() {
                    if (this.fuel > 0) {
                        this.started = true;
                    } else {
                        alert("The car is on empty! Fill up before starting.")
                    }
                },

                stop: function() {
                    this.started = false;
                    alert(this.make + " stopped. The fuel left: " + this.fuel);
                },

                drive: function() {
                    if (this.started) {
                        if (this.fuel > 0) {
                            alert(this.make + " " + this.model + " goes Zoom Zoom!");
                            this.fuel = this.fuel - 1;
                        } else {
                            alert("Uh oh, out of fuel.");
                            this.stop();
                        }
                    } else {
                        alert("You need to start the engine first.");
                    }
                },

                addFuel: function(amount) {
                    this.fuel = this.fuel + amount;
                    alert("Fuel is added.")
                },

                checkFuel: function() {
                    alert("Fuel level is " + this.fuel);
                }
            };

            var cadi = {
                make: "GM",
                model: "Cadillac",
                year: 1955,
                color: "tan",
                passengers: 5,
                convertible: false,
                mileage: 12892,
                started: false,

                start: function() {
                    this.started = true;
                },

                stop: function() {
                    this.started = false;
                },

                drive: function() {
                    if (this.started) {
                        alert(this.make + " " + this.model + " goes Zoom Zoom!");
                    } else {
                        alert("You need to start the engine first.");
                    }
                }
            };

            var chevy = {
                make: "Chevy",
                model: "Bel Air",
                year: 1957,
                color: "red",
                passengers: 2,
                convertible: false,
                mileage: 1021,
                started: false,

                start: function() {
                    this.started = true;
                },

                stop: function() {
                    this.started = false;
                },

                drive: function() {
                    if (this.started) {
                        alert(this.make + " " + this.model + " goes Zoom Zoom!");
                    } else {
                        alert("You need to start the engine first.");
                    }
                }
            };

            var taxi = {
                make: "Webville Motors",
                model: "Taxi",
                year: 1955,
                color: "yellow",
                passengers: 4,
                convertible: false,
                mileage: 281341,
                started: false,

                start: function() {
                    this.started = true;
                },

                stop: function() {
                    this.started = false;
                },

                drive: function() {
                    if (this.started) {
                        alert(this.make + " " + this.model + " goes Zoom Zoom!");
                    } else {
                        alert("You need to start the engine first.");
                    }
                }
            };

            fiat.start();       // Try to drive before refueling — will fail with "out of fuel" message
            fiat.drive();       // Alerts: "The car is on empty! Fill up before starting."
            fiat.addFuel(2);    // Alerts: "Fuel is added."
            fiat.checkFuel();   // Alerts: "Fuel level is 2"
            fiat.start();
            fiat.drive();       // Drive the car — this consumes 1 unit of fuel
            fiat.stop();        // Alerts: "Fiat stopped. The fuel left: 1"

            cadi.start();
            cadi.drive();
            cadi.stop();

            chevy.start();
            chevy.drive();
            chevy.stop();

            taxi.start();
            taxi.drive();
            taxi.stop();


        </script>
    </head>
    <body></body>
</html>
